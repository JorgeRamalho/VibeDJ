# Publicação estática — mantém a raiz enxuta (só index.html) e expõe SEO na raiz do domínio.
[build]
  publish = "."

[[redirects]]
  from = "/robots.txt"
  to = "/meta/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/meta/sitemap.xml"
  status = 200

# COEP só nesta página, para o WASM do onnxruntime usar mais de uma thread.
# As fontes da página são locais: o header bloqueia folha de estilo de outro domínio.
[[headers]]
  for = "/pages/laboratorio.html"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
